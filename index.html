<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distribuidora Allana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-enter { animation: slideUp 0.3s ease-out; }
        .pop-effect { animation: productPop 0.3s ease-out; }
        @keyframes productPop { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }

        @keyframes slideRight {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .social-float {
            animation: slideRight 0.5s ease-out forwards;
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        @keyframes cartBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-cart { animation: cartBounce 0.4s ease-out; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-zoom { animation: zoomIn 0.3s ease-out forwards; }

        @keyframes squeeze {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-squeeze { animation: squeeze 0.3s ease-in-out; }

        @keyframes cartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: cartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }

        @keyframes bounceHand {
            0%, 100% { transform: translateY(0) translateX(-50%) rotate(20deg); }
            50% { transform: translateY(-10px) translateX(-50%) rotate(20deg); }
        }

        .hint-animate {
            animation: fadeInOut 5s ease-in-out forwards;
        }
        .hand-animate {
            animation: bounceHand 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = window.React;
        const { createRoot } = window.ReactDOM;

        const SUPABASE_URL = "https://ejbqlejlgprvwzrptojo.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqYnFsZWpsZ3Bydnd6cnB0b2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwMjkwMjIsImV4cCI6MjA3MjYwNTAyMn0.9fVItJka0MN3nlfowVudIE0AuNmfTJGQcbbqpau2Th8";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const LOGO_URL = "https://rgbjinmllhhymczumwhs.supabase.co/storage/v1/object/public/promo_images/logodistribuidora.png";

        let globalCache = {
            productos: [],
            loaded: false
        };

        function App() {
            const [cliente, setCliente] = useState(null);
            const [localidades, setLocalidades] = useState([]);
            const [productos, setProductos] = useState([]);
            const [categorias, setCategorias] = useState([]);
            const [carrito, setCarrito] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [categoriaFiltro, setCategoriaFiltro] = useState(null);
            const [catOpen, setCatOpen] = useState(false);
            const [showCart, setShowCart] = useState(false);
            const [cantidadesTemp, setCantidadesTemp] = useState({});
            const [showHistorial, setShowHistorial] = useState(false);
            const [misPedidos, setMisPedidos] = useState([]);
            const [pedidosRecuperables, setPedidosRecuperables] = useState([]);
            const [showModalLogin, setShowModalLogin] = useState(false);
            const [tempUser, setTempUser] = useState(null);
            const [showCategoryHint, setShowCategoryHint] = useState(false);
            const [idPedidoEditando, setIdPedidoEditando] = useState(null);
            const [imgAmpliada, setImgAmpliada] = useState(null);
            const [cartAnimating, setCartAnimating] = useState(false);

            const saldoPendiente = useMemo(() => {
                const totalPedidos = misPedidos.reduce((acc, p) => {
                    return acc + (parseFloat(p.total) || 0);
                }, 0);

                const totalPagos = misPedidos.reduce((acc, p) => {
                    let pagosArray = [];
                    if (typeof p.pagos === "string") {
                        try {
                            pagosArray = JSON.parse(p.pagos);
                        } catch {
                            pagosArray = [];
                        }
                    } else if (Array.isArray(p.pagos)) {
                        pagosArray = p.pagos;
                    }

                    const sumaPagosPedido = pagosArray.reduce((subAcc, pago) => {
                        return subAcc + (parseFloat(pago.monto) || 0);
                    }, 0);

                    return acc + sumaPagosPedido;
                }, 0);

                return totalPedidos - totalPagos;
            }, [misPedidos]);

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (carrito.length > 0) {
                        e.preventDefault();
                        e.returnValue = 'Tienes un pedido en curso. ¿Seguro que quieres salir?';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [carrito]);

            useEffect(() => {
                const savedCart = localStorage.getItem('distribuidora_cart');
                if (savedCart) {
                    try {
                        setCarrito(JSON.parse(savedCart));
                    } catch (e) {
                        console.error("Error recuperando carrito");
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('distribuidora_cart', JSON.stringify(carrito));
            }, [carrito]);

            useEffect(() => {
                const handlePopState = (e) => {
                    if (showCart || showHistorial || imgAmpliada || showModalLogin || catOpen) {
                        setShowCart(false);
                        setShowHistorial(false);
                        setImgAmpliada(null);
                        setShowModalLogin(false);
                        setCatOpen(false);
                        history.pushState(null, null, window.location.pathname);
                    }
                };

                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [showCart, showHistorial, imgAmpliada, showModalLogin, catOpen]);

            useEffect(() => {
                if (showCart || showHistorial || imgAmpliada || showModalLogin || catOpen) {
                    history.pushState(null, null, window.location.pathname);
                }
            }, [showCart, showHistorial, imgAmpliada, showModalLogin, catOpen]);

            useEffect(() => {
                if (cliente && !categoriaFiltro && !busqueda && productos.length > 0) {
                    setShowCategoryHint(true);
                    const timer = setTimeout(() => {
                        setShowCategoryHint(false);
                    }, 5000);
                    return () => clearTimeout(timer);
                } else {
                    setShowCategoryHint(false);
                }
            }, [cliente, categoriaFiltro, busqueda, productos.length]);

            useEffect(() => {
                const session = localStorage.getItem('distribuidora_session');
                if (session) setCliente(JSON.parse(session));
                fetchData();
            }, []);

            async function fetchData() {
                if (globalCache.loaded) {
                    const { locs, cats, prods } = globalCache.data;
                    setLocalidades(locs);
                    setCategorias(cats);
                    setProductos(prods);
                    setLoading(false);
                    return;
                }

                try {
                    const [locsRes, catsRes, prodsRes] = await Promise.all([
                        sb.from('localidades').select('id, nombre').order('nombre'),
                        sb.from('categorias').select('id, nombre').order('nombre'),
                        sb.from('promociones').select('id, nombre, precio, stock, categoria_id, imagen').order('nombre')
                    ]);

                    if (prodsRes.data) {
                        globalCache.data = { locs: locsRes.data, cats: catsRes.data, prods: prodsRes.data };
                        globalCache.loaded = true;

                        setLocalidades(locsRes.data);
                        setCategorias(catsRes.data);
                        setProductos(prodsRes.data);

                        const initialCants = {};
                        prodsRes.data.forEach(p => initialCants[p.id] = 1);
                        setCantidadesTemp(initialCants);
                    }
                } catch (err) {
                    console.error("Error cargando datos:", err);
                }
                setLoading(false);
            }

            const filtrados = useMemo(() => {
                if (!categoriaFiltro && !busqueda) return [];
                
                const busquedaLower = busqueda.toLowerCase();
                
                return productos.filter(p => {
                    const matchCat = categoriaFiltro === 'TODOS' || 
                                     categorias.find(c => c.id === p.categoria_id && c.nombre === categoriaFiltro);
                    
                    const matchBus = p.nombre?.toLowerCase().includes(busquedaLower);
                    
                    return busqueda ? matchBus : matchCat;
                });
            }, [productos, categorias, categoriaFiltro, busqueda]);

            const agregarAlCarrito = (prod) => {
                const qtyAAgregar = cantidadesTemp[prod.id] || 1;

                setCarrito(prev => {
                    const itemEnCarrito = prev.find(i => i.id === prod.id);
                    const cantidadActual = itemEnCarrito ? itemEnCarrito.cantidad : 0;

                    if (prod.stock < (cantidadActual + qtyAAgregar)) {
                        alert(`No hay stock suficiente. Máximo disponible: ${prod.stock}`);
                        return prev;
                    }

                    if (itemEnCarrito) {
                        return prev.map(i => i.id === prod.id 
                            ? { ...i, cantidad: i.cantidad + qtyAAgregar } 
                            : i
                        );
                    }
                    return [...prev, { ...prod, cantidad: qtyAAgregar }];
                });
                
                setCartAnimating(true);
                setTimeout(() => setCartAnimating(false), 400);
                setCantidadesTemp(prev => ({ ...prev, [prod.id]: 1 }));
            };

            const updateTempCant = (id, delta, maxStock) => {
                setCantidadesTemp(prev => {
                    const newQty = (prev[id] || 1) + delta;
                    if (newQty < 1) return prev;
                    if (newQty > maxStock) {
                        alert("Stock máximo alcanzado");
                        return prev;
                    }
                    return { ...prev, [id]: newQty };
                });
            };

            const calcularEstadoPedido = (p) => {
                const total = parseFloat(p.total) || 0;
                let pagosArray = [];

                if (typeof p.pagos === "string") {
                    try {
                        pagosArray = JSON.parse(p.pagos);
                    } catch {
                        pagosArray = [];
                    }
                } else if (Array.isArray(p.pagos)) {
                    pagosArray = p.pagos;
                }

                const pagado = pagosArray.reduce((acc, pago) => {
                    return acc + (parseFloat(pago.monto) || 0);
                }, 0);

                const saldo = total - pagado;
                let estado = "pendiente";

                if (saldo <= 0) estado = "pagado";
                else if (pagado > 0) estado = "parcial";

                return { total, pagado, saldo, estado };
            };

            const ampliarImagen = (url) => {
                setImgAmpliada(url);
                setTimeout(() => setImgAmpliada(null), 3000);
            };

            const generarPDF = (items, total) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    const totalNum = parseFloat(total) || 0;
                    
                    doc.setFillColor(23, 37, 84);
                    doc.rect(0, 0, 210, 40, 'F');
                    
                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(22);
                    doc.setFont("helvetica", "bold");
                    doc.text("DISTRIBUIDORA ALLANA", 105, 20, { align: "center" });
                    doc.setFontSize(10);
                    doc.text("COMPROBANTE DE PEDIDO", 105, 30, { align: "center" });

                    doc.setTextColor(0, 0, 0);
                    doc.setFontSize(11);
                    doc.text(`Cliente: ${cliente.nombre}`, 15, 55);
                    doc.text(`DNI: ${cliente.dni}`, 15, 62);
                    doc.text(`Localidad: ${cliente.localidad_nombre}`, 15, 69);
                    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 150, 55);

                    const body = items.map(i => [i.nombre.toUpperCase(), i.cantidad, `$${i.precio.toFixed(2)}`, `$${(i.precio * i.cantidad).toFixed(2)}`]);

                    doc.autoTable({
                        startY: 80,
                        head: [['Producto', 'Cant.', 'Precio Unit.', 'Subtotal']],
                        body: body,
                        headStyles: { fillColor: [23, 37, 84] },
                        theme: 'grid'
                    });

                    const finalY = doc.lastAutoTable.finalY + 10;
                    doc.setFontSize(14);
                    doc.setFont("helvetica", "bold");
                    doc.text(`TOTAL A PAGAR: $${totalNum.toFixed(2)}`, 195, finalY, { align: "right" });

                    doc.save(`Pedido_Allana_${cliente.nombre.replace(/\s/g, '_')}.pdf`);
                } catch (err) {
                    console.error("Error generando PDF:", err);
                    alert("Error al generar PDF");
                }
            };

            const modificarCantidadCarrito = (id, delta) => {
                setCarrito(prev => prev.map(item => {
                    if (item.id === id) {
                        const nuevaCant = item.cantidad + delta;
                        if (nuevaCant < 1) return item; 
                        if (nuevaCant > item.stock) {
                            alert("Límite de stock alcanzado");
                            return item;
                        }
                        return { ...item, cantidad: nuevaCant };
                    }
                    return item;
                }));
            };

            const eliminarDelCarrito = (id) => {
                setCarrito(prev => prev.filter(item => item.id !== id));
            };

            const recuperarPedido = (pedido) => {
                const productosRecuperados = pedido.productos.map(p => ({
                    ...p,
                    stock: productos.find(prod => prod.id === p.id)?.stock || 0
                }));
                
                setCarrito(productosRecuperados);
                setIdPedidoEditando(pedido.id);
                setCliente(tempUser);
                localStorage.setItem('distribuidora_session', JSON.stringify(tempUser));
                setShowModalLogin(false);
            };

            const confirmarPedido = async () => {
                if (carrito.length === 0) return;

                const total = carrito.reduce((acc, i) => acc + (parseFloat(i.precio) * parseInt(i.cantidad)), 0);
                
                const productosParaDB = carrito.map(item => ({
                    id: item.id,
                    nombre: item.nombre,
                    cantidad: item.cantidad,
                    precio: item.precio,
                    subtotal: item.precio * item.cantidad
                }));

                const fechaActualArg = new Date().toISOString();

                try {
                    if (idPedidoEditando) {
                        const { error } = await sb.rpc('actualizar_pedido_con_stock', {
                            pedido_id: idPedidoEditando,
                            nuevos_productos: productosParaDB,
                            nuevo_total: total
                        });
                        
                        if (error) throw error;
                        alert("✅ Pedido actualizado correctamente");
                    } else {
                        const { error: pError } = await sb.from('pedidos').insert([{
                            cliente: cliente.nombre, 
                            dni: cliente.dni, 
                            localidad_id: parseInt(cliente.localidad_id), 
                            productos: productosParaDB, 
                            total: total,
                            created_at: fechaActualArg,
                            pagos: 0,
                            archivado: false,
                            estado: "pendiente",
                            preparado: false
                        }]);

                        if (pError) throw pError;

                        const stockPromises = carrito.map(item => 
                            sb.rpc('decrement_stock', { row_id: item.id, amount: item.cantidad })
                        );
                        await Promise.all(stockPromises);
                        
                        alert("🚀 ¡Pedido nuevo enviado con éxito!");
                    }

                    generarPDF(carrito, total);
                    
                    setCarrito([]);
                    setIdPedidoEditando(null); 
                    setShowCart(false);
                    
                    fetchData();
                    
                    const { data: nuevosPedidos } = await sb.from('pedidos')
                        .select('*')
                        .eq('dni', cliente.dni)
                        .order('created_at', { ascending: false });
                    if (nuevosPedidos) setMisPedidos(nuevosPedidos);

                } catch (error) {
                    console.error("Error al procesar el pedido:", error);
                    alert(`Hubo un error: ${error.message || 'Error desconocido'}`);
                }
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-black text-blue-900 animate-pulse">CARGANDO...</div>;

            if (!cliente) return (
                <div className="min-h-screen bg-blue-900 flex items-center justify-center p-6 relative">
                    {showModalLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-blue-900/90 backdrop-blur-xl p-4">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 modal-enter shadow-2xl">
                                <div className="text-center mb-6">
                                    <div className="text-4xl mb-2">👋</div>
                                    <h2 className="text-2xl font-black text-blue-900 uppercase leading-tight">¡Hola de nuevo!</h2>
                                    <p className="text-gray-400 text-sm font-bold mt-1">¿Qué deseas hacer hoy?</p>
                                </div>
                                <div className="space-y-3 mb-6">
                                    {pedidosRecuperables.slice(0, 1).map(p => (
                                        <button 
                                            key={p.id} 
                                            onClick={() => recuperarPedido(p)}
                                            className="w-full bg-blue-50 border-2 border-blue-900 p-4 rounded-2xl text-left hover:bg-blue-100"
                                        >
                                            <p className="text-[10px] font-black text-blue-900/50 uppercase">
                                                Último pedido: {new Date(p.created_at).toLocaleDateString()}
                                            </p>
                                            <span className="font-black text-blue-900 text-sm italic">RECUPERAR Y EDITAR ESTE PEDIDO</span>
                                        </button>
                                    ))}
                                    <button onClick={() => {
                                        setCliente(tempUser);
                                        localStorage.setItem('distribuidora_session', JSON.stringify(tempUser));
                                        setCarrito([]);
                                        setShowModalLogin(false);
                                    }} className="w-full bg-blue-900 text-white py-5 rounded-2xl font-black uppercase shadow-lg hover:bg-blue-800">
                                        Empezar Pedido Nuevo
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const form = e.target;
                        const datos = {
                            nombre: form.nombre.value,
                            dni: form.dni.value,
                            localidad_id: form.localidad.value,
                            localidad_nombre: form.localidad.options[form.localidad.selectedIndex].text
                        };

                        try {
                            const { data, error } = await sb.from('pedidos').select('*').eq('dni', datos.dni).order('created_at', { ascending: false });
                            if (!error && data && data.length > 0) {
                                setPedidosRecuperables(data);
                                setTempUser(datos);
                                setShowModalLogin(true);
                            } else {
                                setCliente(datos);
                                localStorage.setItem('distribuidora_session', JSON.stringify(datos));
                            }
                        } catch (err) {
                            setCliente(datos);
                            localStorage.setItem('distribuidora_session', JSON.stringify(datos));
                        }
                    }} className="bg-white p-8 rounded-[2.5rem] w-full max-w-sm flex flex-col items-center shadow-2xl">
                        <img src={LOGO_URL} className="w-40 mb-6" alt="Logo" />
                        <input name="nombre" placeholder="Nombre Completo" className="w-full bg-gray-50 border-2 p-4 mb-3 rounded-2xl outline-none focus:border-blue-900" required />
                        <input name="dni" type="number" placeholder="DNI" className="w-full bg-gray-50 border-2 p-4 mb-3 rounded-2xl outline-none focus:border-blue-900" required />
                        <select name="localidad" className="w-full bg-gray-50 border-2 p-4 mb-6 rounded-2xl outline-none focus:border-blue-900" required>
                            <option value="">Tu Localidad</option>
                            {localidades.map(l => <option key={l.id} value={l.id}>{l.nombre}</option>)}
                        </select>
                        <button type="submit" className="w-full bg-blue-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-transform hover:bg-blue-800">
                            Ingresar
                        </button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col pb-24">
                    <header className="bg-white p-3 shadow-sm sticky top-0 z-40">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <div className="flex flex-col">
                                <img src={LOGO_URL} className="h-12 object-contain self-start mb-1" alt="Logo" />
                                <div className="leading-tight">
                                    <p className="text-[16px] font-black text-blue-900 uppercase tracking-tighter">
                                        {cliente.nombre}
                                    </p>
                                    <p className="text-[14px] font-bold text-gray-400 uppercase">
                                        {cliente.localidad_nombre}
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-col items-end gap-1">
                                <button 
                                    onClick={async () => {
                                        const { data } = await sb.from('pedidos')
                                            .select('*')
                                            .eq('dni', cliente.dni)
                                            .order('created_at', { ascending: false });
                                        setMisPedidos(data || []);
                                        setShowHistorial(true);
                                    }}
                                    className="text-[14px] font-black text-blue-900 bg-blue-50 px-4 py-2 rounded-xl uppercase border border-blue-100 active:bg-blue-100 hover:bg-blue-100"
                                >
                                    📋 Historial
                                </button>
                                
                                <div className="px-2 py-1 text-right">
                                    <p className="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Saldo</p>
                                    <p className={`text-[14px] font-black ${saldoPendiente > 0 ? 'text-red-600' : 'text-green-600'}`}>
                                        ${saldoPendiente.toLocaleString('es-AR', { minimumFractionDigits: 2 })}
                                    </p>
                                </div>
                            </div>
                            
                            <button 
                                onClick={() => {localStorage.clear(); location.reload();}} 
                                className="text-[14px] font-black text-red-500 bg-red-50 px-4 py-2 rounded-xl uppercase border border-red-100 active:bg-red-100 hover:bg-red-100"
                            >
                                Salir
                            </button>
                        </div>

                        <div className="max-w-2xl mx-auto mt-3">
                            <input 
                                type="text" 
                                placeholder="🔎 Buscar productos..." 
                                className="w-full bg-gray-100 p-3 rounded-xl outline-none text-xs border-2 border-transparent focus:border-blue-900 transition-all" 
                                onChange={(e) => setBusqueda(e.target.value)} 
                            />
                        </div>
                    </header>

                    <main className="p-4 flex-grow max-w-2xl mx-auto w-full">
                        <div className="relative mb-6">
                            {showCategoryHint && (
                                <div className="absolute -top-16 left-1/2 -translate-x-1/2 z-50 text-center w-full hint-animate pointer-events-none">
                                    <div className="flex flex-col items-center">
                                        <p className="bg-blue-900 text-white px-6 py-3 rounded-full text-[11px] font-black uppercase tracking-widest shadow-2xl border-2 border-white mb-1">
                                            ¡Selecciona una categoría!
                                        </p>
                                        <span className="text-4xl hand-animate inline-block">👇</span>
                                    </div>
                                </div>
                            )}

                            <button 
                                onClick={() => {
                                    setCatOpen(!catOpen);
                                    setShowCategoryHint(false);
                                }} 
                                className="w-full bg-white p-5 rounded-2xl border-2 border-white shadow-sm flex justify-between items-center font-black text-blue-900 uppercase text-[14px] active:scale-95 transition-transform"
                            >
                                <span>📦 {categoriaFiltro || 'SELECCIONAR'}</span>
                                <span className={`transition-transform duration-300 ${catOpen ? 'rotate-180' : ''}`}>▼</span>
                            </button>

                            {catOpen && (
                                <div className="absolute w-full mt-2 bg-white rounded-2xl shadow-xl border overflow-hidden modal-enter z-40">
                                    <button 
                                        onClick={() => { setCategoriaFiltro('TODOS'); setCatOpen(false); }} 
                                        className="w-full p-4 text-left border-b hover:bg-gray-50 font-bold text-xs text-gray-400 uppercase"
                                    >
                                        Mostrar Todo
                                    </button>
                                    {categorias.map(c => (
                                        <button 
                                            key={c.id} 
                                            onClick={() => { setCategoriaFiltro(c.nombre); setCatOpen(false); }} 
                                            className="w-full p-4 text-left border-b font-black text-xs text-blue-900 uppercase active:bg-blue-50 hover:bg-blue-50"
                                        >
                                            {c.nombre}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 gap-4">
                            {filtrados.length === 0 && !loading && (
                                <div className="text-center py-20 bg-gray-50/50 rounded-[3rem] border-2 border-dashed border-gray-200">
                                    <p className="text-gray-400 font-black uppercase tracking-widest text-sm px-10">
                                        {busqueda || categoriaFiltro ? "No hay productos" : "Selecciona una categoría"}
                                    </p>
                                </div>
                            )}

                            {filtrados.map(p => {
                                const precioAnt = (p.precio * 1.30).toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
                                const precioActual = p.precio.toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
                                const stockColor = p.stock > 10 ? 'text-green-600 bg-green-50' : p.stock > 0 ? 'text-orange-600 bg-orange-50' : 'text-red-600 bg-red-50';
                                const stockLabel = p.stock > 0 ? `${p.stock} unidades` : 'Sin stock';

                                return (
                                    <div key={p.id} className="bg-white p-4 rounded-[2rem] shadow-sm border border-gray-100 flex gap-4 items-center relative overflow-hidden transition-all active:scale-95">
                                        <div 
                                            onClick={() => ampliarImagen(`${SUPABASE_URL}/storage/v1/object/public/promo_images/${p.imagen}`)}
                                            className="w-24 h-24 flex-shrink-0 bg-gray-50 rounded-2xl p-2 flex items-center justify-center cursor-zoom-in active:opacity-70 transition-opacity hover:shadow-md"
                                        >
                                            <img 
                                                src={`${SUPABASE_URL}/storage/v1/object/public/promo_images/${p.imagen}`} 
                                                alt={p.nombre}
                                                className="max-w-full max-h-full object-contain"
                                            />
                                        </div>

                                        <div className="flex-1 flex flex-col justify-between h-28">
                                            <div>
                                                <h3 className="text-[11px] font-bold uppercase text-gray-500 leading-tight mb-1">{p.nombre}</h3>
                                                
                                                <div className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md ${stockColor} mb-2`}>
                                                    <span className="text-[12px] font-black uppercase tracking-tighter">{stockLabel}</span>
                                                </div>

                                                <div className="flex items-baseline gap-2">
                                                    <span className="text-blue-900 font-black text-xl">{precioActual}</span>
                                                    <span className="text-gray-400 text-xs line-through">{precioAnt}</span>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <div className="flex items-center bg-gray-100 rounded-lg p-0.5 border">
                                                    <button onClick={() => updateTempCant(p.id, -1, p.stock)} className="w-7 h-7 font-black text-blue-900 hover:bg-gray-200 rounded">−</button>
                                                    <span className="w-6 text-center text-xs font-black">{cantidadesTemp[p.id] || 1}</span>
                                                    <button onClick={() => updateTempCant(p.id, 1, p.stock)} className="w-7 h-7 font-black text-blue-900 hover:bg-gray-200 rounded">+</button>
                                                </div>
                                                <button 
                                                    onClick={() => agregarAlCarrito(p)} 
                                                    disabled={p.stock <= 0}
                                                    className="flex-1 bg-blue-900 text-white py-2 rounded-lg font-black text-[9px] uppercase tracking-tighter disabled:bg-gray-300 transition-all active:scale-95 hover:bg-blue-800"
                                                >
                                                    {p.stock > 0 ? 'Agregar' : 'Agotado'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    <div className="fixed bottom-6 left-6 z-50 flex flex-col gap-3 social-float">
                        <a 
                            href="https://wa.me/5493855845002" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="social-icon w-12 h-12 bg-[#25D366] rounded-full shadow-lg flex items-center justify-center border-2 border-white active:scale-90 transition-transform hover:shadow-xl"
                            title="WhatsApp"
                        >

                        </a>

                        <a 
                            href="https://www.instagram.com/distribuidoraallanasgo/" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="social-icon w-12 h-12 bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] rounded-full shadow-lg flex items-center justify-center border-2 border-white active:scale-90 transition-transform hover:shadow-xl"
                            title="Instagram"
                        >
                            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.17.054 1.805.249 2.227.412.56.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.359 1.057.413 2.227.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.054 1.17-.249 1.805-.412 2.227-.217.56-.477.96-.896 1.382-.42.419-.819.679-1.381.896-.422.164-1.057.359-2.227.413-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.17-.054-1.805-.249-2.227-.412-.56-.217-.96-.477-1.382-.896-.419-.42-.679-.819-.896-1.381-.164-.422-.359-1.057-.413-2.227-.058-1.266-.07-1.646-.07-4.85s.012-3.584.07-4.85c.054-1.17.249-1.805.412-2.227.217-.56.477-.96.896-1.382.42-.419.819-.679 1.381-.896.422-.164 1.057-.359 2.227-.413 1.266-.058 1.646-.07 4.85-.07M12 0C8.741 0 8.333.014 7.053.072 5.775.13 4.902.333 4.151.63c-.789.306-1.459.717-2.126 1.384S.766 3.362.46 4.151C.163 4.902 0 5.775-.058 7.053.014 8.333 0 8.741 0 12s.014 3.667.072 4.947c.058 1.277.261 2.148.558 2.899.306.789.717 1.459 1.384 2.126.667.667 1.337 1.078 2.126 1.384.751.297 1.622.5 2.899.558 1.28.058 1.688.072 4.947.072s3.667-.014 4.947-.072c1.277-.058 2.148-.261 2.899-.558.789-.306 1.459-.717 2.126-1.384.667-.667 1.078-1.337 1.384-2.126.297-.751.5-1.622.558-2.899.058-1.28.072-1.688.072-4.947s-.014-3.667-.072-4.947c-.058-1.277-.261-2.148-.558-2.899-.306-.789-.717-1.459-1.384-2.126-.667-.667-1.337-1.078-2.126-1.384-.751-.297-1.622-.5-2.899-.558C15.667.014 15.259 0 12 0Zm0 5.838a6.162 6.162 0 1 1 0 12.324 6.162 6.162 0 0 1 0-12.324ZM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm4.965-10.322a1.44 1.44 0 1 1 0-2.88 1.44 1.44 0 0 1 0 2.88Z"/></svg>
                        </a>

                        <a 
                            href="https://www.tiktok.com/@distribuidoraallana" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="social-icon w-12 h-12 bg-black rounded-full shadow-lg flex items-center justify-center border-2 border-white active:scale-90 transition-transform hover:shadow-xl"
                            title="TikTok"
                        >
                            <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.06-.03-.11-.06-.16-.09-.04 2.52.01 5.05-.03 7.56 0 .55-.05 1.1-.1 1.63-.07.87-.31 1.73-.71 2.5-.4.75-.98 1.41-1.64 1.93-.84.74-1.86 1.23-2.94 1.44-1.08.21-2.19.2-3.27-.04-.84-.2-1.64-.55-2.34-1.04-.7-.48-1.28-1.1-1.74-1.82-.46-.72-.77-1.53-.93-2.37-.17-1.08-.16-2.18 0-3.26.24-1.74.94-3.4 2-4.66 1.06-1.26 2.55-2.1 4.16-2.4 1.61-.3 3.26-.15 4.84.44l1.5-3.6c.1-.25.13-.53.09-.8-.04-.27-.15-.53-.33-.74-.18-.21-.42-.35-.67-.41-1.45-.46-2.93-.65-4.4-.57zm-5.7 6.12c-.96 1.12-1.6 2.53-1.68 4.01-.08 1.48.25 2.95 1.06 4.23.81 1.28 2.03 2.3 3.44 2.88 1.41.57 3.01.66 4.5.24 1.49-.42 2.83-1.35 3.75-2.63.92-1.28 1.39-2.9 1.34-4.52-.05-1.62-.62-3.2-1.66-4.47-.96-1.12-2.4-1.85-3.95-1.98l-.03 3.6c.35.11.67.34.9.65.23.31.36.68.37 1.06.01.38-.1.76-.32 1.08-.22.32-.55.56-.92.67-.37.11-.77.09-1.13-.06-.36-.15-.67-.43-.85-.79-.18-.36-.22-.78-.11-1.17l3.88-1.12c.36-.1.68-.33.89-.65.21-.32.29-.71.23-1.09-.06-.38-.27-.72-.57-.93-.3-.21-.69-.31-1.08-.27-1.77.24-3.5 1.14-4.75 2.52z"/></svg>
                        </a>
                    </div>

                    <div className="fixed bottom-6 right-6 z-50">
                        <button 
                            onClick={() => setShowCart(true)} 
                            className={`w-16 h-16 rounded-full bg-blue-900 shadow-2xl flex items-center justify-center border-4 border-white transition-all ${cartAnimating ? 'animate-pop' : ''} hover:bg-blue-800`}
                        >
                            <span className="text-2xl">🛒</span>
                            {carrito.length > 0 && (
                                <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-7 h-7 rounded-full flex items-center justify-center border-2 border-white">
                                    {carrito.reduce((acc, i) => acc + i.cantidad, 0)}
                                </span>
                            )}
                        </button>
                    </div>

                    {showCart && (
                        <div className="fixed inset-0 bg-black/60 z-[60] flex items-end backdrop-blur-sm" onClick={() => setShowCart(false)}>
                            <div className="bg-white w-full max-h-[90vh] rounded-t-[2.5rem] p-8 flex flex-col modal-enter shadow-2xl" onClick={e => e.stopPropagation()}>
                                
                                <button 
                                    onClick={() => setShowCart(false)}
                                    className="mb-4 self-center bg-gray-100 text-gray-500 px-6 py-2 rounded-full font-black text-[15px] uppercase tracking-widest border border-gray-200 active:scale-95 hover:bg-gray-200"
                                >
                                    ↑ Seguir agregando
                                </button>

                                <h2 className="text-2xl font-black text-blue-900 mb-6 uppercase flex justify-between items-center">
                                    Tu Pedido
                                    <span className="text-xs bg-blue-100 text-blue-900 px-3 py-1 rounded-full">{carrito.length} Items</span>
                                </h2>

                                <div className="flex-grow overflow-y-auto space-y-4 mb-6 no-scrollbar">
                                    {carrito.length === 0 ? (
                                        <p className="text-center py-10 text-gray-400 font-bold">Tu carrito está vacío</p>
                                    ) : (
                                        carrito.map(item => (
                                            <div key={item.id} className="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-gray-100 hover:shadow-md">
                                                <div className="flex-1">
                                                    <p className="text-[15px] font-black uppercase text-gray-700 leading-tight mb-1">{item.nombre}</p>
                                                    <div className="flex items-center gap-3">
                                                        <div className="flex items-center bg-white rounded-lg border shadow-sm">
                                                            <button onClick={() => modificarCantidadCarrito(item.id, -1)} className="w-8 h-8 text-blue-900 font-black hover:bg-gray-100">−</button>
                                                            <span className="w-8 text-center text-xs font-black">{item.cantidad}</span>
                                                            <button onClick={() => modificarCantidadCarrito(item.id, 1)} className="w-8 h-8 text-blue-900 font-black hover:bg-gray-100">+</button>
                                                        </div>
                                                        <button onClick={() => eliminarDelCarrito(item.id)} className="text-red-400 text-[15px] font-bold uppercase underline hover:text-red-600">Eliminar</button>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <p className="font-black text-blue-900">${(item.precio * item.cantidad).toLocaleString('es-AR')}</p>
                                                    <p className="text-[9px] text-gray-400 font-bold">${item.precio.toLocaleString('es-AR')} c/u</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="border-t pt-6">
                                    <div className="flex justify-between items-end mb-6">
                                        <div>
                                            <span className="text-gray-400 font-black uppercase text-[10px] block">Total estimado</span>
                                            <span className="text-3xl font-black text-blue-900">${carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0).toLocaleString('es-AR')}</span>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={confirmarPedido} 
                                        disabled={carrito.length === 0}
                                        className="w-full bg-green-600 text-white py-6 rounded-2xl font-black uppercase shadow-xl active:scale-[0.98] transition-transform disabled:bg-gray-300 hover:bg-green-700"
                                    >
                                        Confirmar y Descargar PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {imgAmpliada && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-6" onClick={() => setImgAmpliada(null)}>
                            <div className="relative animate-zoom">
                                <img 
                                    src={imgAmpliada} 
                                    alt="Producto ampliado"
                                    className="max-w-full max-h-[70vh] rounded-3xl shadow-2xl border-4 border-white" 
                                />
                                <div className="absolute -bottom-12 left-0 right-0 text-center text-white font-black uppercase text-xs tracking-widest">
                                    Se cerrará automáticamente...
                                </div>
                            </div>
                        </div>
                    )}

                    {showHistorial && (
                        <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md max-h-[80vh] rounded-[2rem] p-6 flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-black text-blue-900 uppercase">Mis Pedidos</h2>
                                    <button onClick={() => setShowHistorial(false)} className="text-gray-400 font-bold hover:text-gray-600">✕</button>
                                </div>
                                
                                <div className="overflow-y-auto space-y-3 no-scrollbar">
                                    {misPedidos.length === 0 ? (
                                        <p className="text-center py-10 text-gray-400">
                                            No tienes pedidos.
                                        </p>
                                    ) : (
                                        misPedidos.map(p => {
                                            const { total, pagado, saldo, estado } = calcularEstadoPedido(p);

                                            return (
                                                <div key={p.id} className="bg-gray-50 p-4 rounded-2xl border border-gray-100 hover:shadow-md">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <p className="text-[10px] font-black text-gray-400 uppercase">
                                                                {new Date(p.created_at).toLocaleDateString()}
                                                            </p>
                                                            <p className="text-[13px] font-black text-blue-900">Pedido #{p.id}</p>
                                                        </div>
                                                        <span className={`text-[10px] font-black px-2 py-1 rounded ${estado === 'pagado' ? 'bg-green-100 text-green-700' : estado === 'parcial' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>
                                                            {estado.toUpperCase()}
                                                        </span>
                                                    </div>
                                                    <p className="text-[11px] text-gray-600 mb-2">
                                                        Total: ${total.toLocaleString('es-AR')} | Pagado: ${pagado.toLocaleString('es-AR')} | Saldo: ${saldo.toLocaleString('es-AR')}
                                                    </p>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Renderizar la aplicación
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
